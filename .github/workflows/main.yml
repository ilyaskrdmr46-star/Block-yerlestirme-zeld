name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "BlockPuzzleBotTablet/gradlew" ]; then
            cd BlockPuzzleBotTablet
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradlew bulunamadı, ana dizinde derleniyor."
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: block-puzzle-bot-apk
          path: "**/build/outputs/apk/debug/*.apk"
