name: Build APK From Zip

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Extract Project Zip
        run: |
          sudo apt-get install unzip
          # Klasördeki ilk bulduğu .zip dosyasını dışarı çıkartır
          unzip -o *.zip
          # Dosyaların nereye çıktığını kontrol etmek için listele
          ls -R

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android APK
        run: |
          # Eğer alt klasöre çıktıysa oraya girip derler, yoksa ana dizinde çalışır
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -d "BlockPuzzleBotTablet" ]; then
            cd BlockPuzzleBotTablet
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            # Eğer gradlew hiç yoksa sistemin kendi gradle motorunu kullanır
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: block-puzzle-bot-apk
          path: "**/build/outputs/apk/debug/*.apk"
